<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>חשבון חשמל לרכב</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0F766E" />

  <!-- iOS: התנהגות כמו אפליקציה במסך מלא -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="חשבון חשמל" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/favicon-64.png" />

  <style>
    :root{
      --primary:#0F766E; --primary-dark:#115E59; --primary-light:#14B8A6;
      --bg:#F0FDFA; --card:#FFFFFF; --text:#0F172A; --muted:#64748B;
      --border:#E2E8F0; --success:#16A34A; --danger:#DC2626;
      --shadow:0 2px 12px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg); color:var(--text);
      display:flex; flex-direction:column; min-height:100vh;
      min-height:100dvh;
    }
    /* כותרת */
    header{
      background:var(--primary); color:#fff;
      padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;
      text-align:center; font-size:20px; font-weight:900;
      flex-shrink:0;
    }
    /* תוכן */
    main{flex:1; overflow-y:auto; padding:16px; padding-bottom:24px;
      -webkit-overflow-scrolling:touch;}
    .screen{display:none;}
    .screen.active{display:block;}

    .card{background:var(--card); border-radius:20px; padding:24px; box-shadow:var(--shadow);}
    .card + .card{margin-top:16px;}
    h2{font-size:20px; font-weight:800; text-align:right;}
    .subtitle{font-size:14px; color:var(--muted); text-align:right; margin-top:4px; margin-bottom:8px;}
    label{display:block; font-size:15px; font-weight:600; text-align:right; margin:14px 0 6px;}
    input{
      width:100%; border:1.5px solid var(--border); border-radius:12px;
      padding:14px 16px; font-size:18px; font-weight:700; color:var(--text);
      background:var(--bg); text-align:right; font-family:inherit;
    }
    input:focus{outline:none; border-color:var(--primary-light);}
    .settings-input{font-size:16px; font-weight:500;}

    .btn{
      width:100%; margin-top:20px; background:var(--primary); color:#fff;
      border:none; border-radius:12px; padding:15px; font-size:17px;
      font-weight:800; box-shadow:var(--shadow); cursor:pointer; font-family:inherit;
    }
    .btn:active{transform:scale(.99);}
    .btn.done{background:var(--success);}
    .btn.secondary{background:var(--card); color:var(--primary); border:1.5px solid var(--primary); box-shadow:none;}

    .live{
      margin-top:20px; background:var(--bg); border-radius:12px; padding:16px;
      display:flex; justify-content:space-between; align-items:center;
    }
    .live .l{font-size:15px; color:var(--primary-dark); font-weight:600;}
    .live .v{font-size:24px; font-weight:900; color:var(--primary);}
    .error{color:var(--danger); font-size:14px; text-align:right; margin-top:14px; font-weight:600;}
    .formula{font-size:13px; color:var(--muted); font-weight:600; text-align:center; margin-top:16px;}
    .success-banner{font-size:16px; font-weight:800; color:var(--success); text-align:center; margin-bottom:16px;}

    /* תצוגת פירוט (פתק) */
    .note{background:var(--card); border-radius:20px; padding:24px; border:1px solid var(--border); box-shadow:var(--shadow);}
    .note .title{font-size:18px; font-weight:800; color:var(--primary); text-align:right; margin-bottom:8px;}
    .note .line{font-size:15px; text-align:right; margin-bottom:4px;}
    .divider{height:1px; background:var(--border); margin:16px 0;}
    .row{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
    .row .label{font-size:15px; color:var(--muted);}
    .row .value{font-size:16px; font-weight:700;}
    .total{display:flex; justify-content:space-between; align-items:center; background:var(--bg); border-radius:12px; padding:16px;}
    .total .l{font-size:16px; font-weight:700; color:var(--primary-dark);}
    .total .v{font-size:22px; font-weight:900; color:var(--primary);}

    /* היסטוריה */
    .hist-card{background:var(--card); border-radius:20px; padding:16px; box-shadow:var(--shadow); margin-bottom:16px;}
    .hist-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
    .hist-amount{font-size:22px; font-weight:900; color:var(--primary);}
    .hist-date{font-size:13px; color:var(--muted);}
    .hist-readings{display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; font-size:13px; margin-bottom:10px;}
    .hist-actions{display:flex; justify-content:flex-end; gap:8px; border-top:1px solid var(--border); padding-top:10px;}
    .chip{padding:6px 16px; border-radius:8px; background:var(--bg); color:var(--primary); font-size:14px; font-weight:700; border:none; cursor:pointer; font-family:inherit;}
    .chip.del{background:#FEF2F2; color:var(--danger);}
    .empty{text-align:center; padding:40px 20px;}
    .empty .icon{font-size:56px;}
    .empty .t{font-size:20px; font-weight:800; margin-top:12px;}
    .empty .s{font-size:15px; color:var(--muted); margin-top:4px;}

    .about{font-size:14px; color:var(--muted); text-align:right; line-height:1.5;}
    .hint{font-size:12px; color:var(--muted); text-align:right; margin-top:4px;}

    /* טאב-בר תחתון */
    nav{
      display:flex; background:var(--card); border-top:1px solid var(--border);
      padding:8px 0 calc(env(safe-area-inset-bottom) + 8px); flex-shrink:0;
    }
    nav button{
      flex:1; background:none; border:none; cursor:pointer; font-family:inherit;
      display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px;
    }
    nav .ico{font-size:22px; opacity:.5;}
    nav .lbl{font-size:12px; color:var(--muted); font-weight:600;}
    nav button.active .ico{opacity:1;}
    nav button.active .lbl{color:var(--primary); font-weight:800;}

    /* טוסט */
    #toast{
      position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
      background:var(--text); color:#fff; padding:12px 22px; border-radius:24px;
      font-size:15px; font-weight:700; opacity:0; transition:opacity .25s; pointer-events:none; z-index:99;
    }
    #toast.show{opacity:.95;}
  </style>
</head>
<body>
  <header id="title">חשבון חשמל לרכב</header>

  <main>
    <!-- ===== מסך חישוב ===== -->
    <section id="screen-calc" class="screen active">
      <div id="calc-form">
        <div class="card">
          <h2>חישוב חשבון חשמל</h2>
          <div class="subtitle" id="rate-line"></div>

          <label for="prev">קריאה קודמת</label>
          <input id="prev" type="number" inputmode="decimal" placeholder="0" />

          <label for="curr">קריאה נוכחית</label>
          <input id="curr" type="number" inputmode="decimal" placeholder="0" />

          <div class="live" id="live" style="display:none">
            <span class="l">סכום משוער</span>
            <span class="v" id="live-val"></span>
          </div>

          <div class="error" id="calc-error" style="display:none"></div>

          <button class="btn" id="calc-btn">חשב ושמור חשבון</button>
        </div>
        <div class="formula" id="formula"></div>
      </div>

      <div id="calc-result" style="display:none">
        <div class="success-banner">✓ החשבון נשמר בהצלחה</div>
        <div id="result-note"></div>
        <button class="btn secondary" id="new-bill-btn">+ חשבון חדש</button>
      </div>
    </section>

    <!-- ===== מסך היסטוריה ===== -->
    <section id="screen-history" class="screen">
      <div id="history-list"></div>
    </section>

    <!-- ===== מסך הגדרות ===== -->
    <section id="screen-settings" class="screen">
      <div class="card">
        <h2>פרטים אישיים</h2>
        <div class="subtitle">הפרטים האלה מופיעים בטקסט שמועתק עבור כל חשבון</div>

        <label for="name">שם משתמש</label>
        <input id="name" class="settings-input" type="text" placeholder="לדוגמה: דני כהן" />

        <label for="address">כתובת המונה</label>
        <input id="address" class="settings-input" type="text" placeholder="לדוגמה: רחוב הרצל 5, תל אביב" />

        <label for="rate">תעריף לקוט"ש (₪)</label>
        <input id="rate" class="settings-input" type="number" inputmode="decimal" placeholder="0.68" />
        <div class="hint">ברירת מחדל: 0.68 ₪ לקוט"ש</div>

        <button class="btn" id="save-settings-btn">שמור הגדרות</button>
      </div>

      <div class="card">
        <h2>אודות</h2>
        <p class="about">אפליקציה למעקב וחישוב תשלום חשבון חשמל לטעינת רכב חשמלי. החישוב מתבצע לפי הנוסחה: (קריאה נוכחית − קריאה קודמת) × תעריף.</p>
      </div>
    </section>
  </main>

  <nav>
    <button data-tab="calc" class="active"><span class="ico">🧮</span><span class="lbl">חישוב</span></button>
    <button data-tab="history"><span class="ico">📜</span><span class="lbl">היסטוריה</span></button>
    <button data-tab="settings"><span class="ico">⚙️</span><span class="lbl">הגדרות</span></button>
  </nav>

  <div id="toast"></div>

  <script>
  (function(){
    "use strict";

    var DEFAULT_RATE = 0.68;
    var BILLS_KEY = 'energy_payment_bills';
    var SETTINGS_KEY = 'energy_payment_settings';

    // ---------- אחסון ----------
    function loadBills(){
      try{ var r = localStorage.getItem(BILLS_KEY); var a = r ? JSON.parse(r) : [];
        a.sort(function(x,y){ return new Date(y.createdAt) - new Date(x.createdAt); }); return a;
      }catch(e){ return []; }
    }
    function saveBills(b){ localStorage.setItem(BILLS_KEY, JSON.stringify(b)); }
    function loadSettings(){
      try{ var r = localStorage.getItem(SETTINGS_KEY); var s = r ? JSON.parse(r) : {};
        return { userName:s.userName||'', address:s.address||'', rate:(s.rate>0?s.rate:DEFAULT_RATE) };
      }catch(e){ return { userName:'', address:'', rate:DEFAULT_RATE }; }
    }
    function saveSettings(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

    var bills = loadBills();
    var settings = loadSettings();

    // ---------- חישוב ועיצוב ----------
    function calcAmount(prev, curr, rate){ return Math.round((curr - prev) * rate * 100) / 100; }
    function fmtNum(v){
      if(Number.isInteger(v)) return String(v);
      return parseFloat(v.toFixed(2)).toString();
    }
    function fmtCur(v){ return fmtNum(v) + ' ₪'; }
    function fmtDate(iso){
      var d = new Date(iso), p = function(n){ return String(n).padStart(2,'0'); };
      return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
    }
    // טקסט ההעתקה בפורמט המבוקש
    function buildText(bill){
      var name = (settings.userName||'').trim() || 'משתמש';
      var addr = (settings.address||'').trim() || 'כתובת לא הוזנה';
      return [
        name + ' — פרוט חשבון חשמל', '',
        'תשלום חשבון מונה עבור ' + addr, '',
        'קריאה קודמת - ' + fmtNum(bill.previousReading),
        'קריאה נוכחית - ' + fmtNum(bill.currentReading), '',
        'סהכ הועברו ' + fmtNum(bill.amount) + ' שקלים'
      ].join('\n');
    }

    // ---------- העתקה ----------
    function copyText(text){
      if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(text).then(function(){ toast('הטקסט הועתק!'); })
          .catch(function(){ fallbackCopy(text); });
      } else { fallbackCopy(text); }
    }
    function fallbackCopy(text){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try{ document.execCommand('copy'); toast('הטקסט הועתק!'); }
      catch(e){ toast('לא ניתן להעתיק אוטומטית'); }
      document.body.removeChild(ta);
    }
    var toastTimer;
    function toast(msg){
      var t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
    }

    function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

    // ---------- תצוגת פתק ----------
    function noteHTML(bill){
      var name = esc((settings.userName||'').trim() || 'משתמש');
      var addr = esc((settings.address||'').trim() || 'כתובת לא הוזנה');
      return '<div class="note">'+
        '<div class="title">'+name+' — פרוט חשבון חשמל</div>'+
        '<div class="line">תשלום חשבון מונה עבור '+addr+'</div>'+
        '<div class="divider"></div>'+
        '<div class="row"><span class="label">קריאה קודמת</span><span class="value">'+fmtNum(bill.previousReading)+'</span></div>'+
        '<div class="row"><span class="label">קריאה נוכחית</span><span class="value">'+fmtNum(bill.currentReading)+'</span></div>'+
        '<div class="divider"></div>'+
        '<div class="total"><span class="l">סה"כ הועברו</span><span class="v">'+fmtCur(bill.amount)+'</span></div>'+
      '</div>';
    }

    // ---------- מסך חישוב ----------
    var $prev=document.getElementById('prev'), $curr=document.getElementById('curr'),
        $live=document.getElementById('live'), $liveVal=document.getElementById('live-val'),
        $err=document.getElementById('calc-error'), $form=document.getElementById('calc-form'),
        $res=document.getElementById('calc-result'), $note=document.getElementById('result-note');

    function refreshCalcDefaults(){
      document.getElementById('rate-line').textContent = 'תעריף: ' + fmtCur(settings.rate) + ' לקוט"ש';
      document.getElementById('formula').textContent =
        '( קריאה נוכחית − קריאה קודמת ) × ' + fmtNum(settings.rate) + ' = חשבון';
      if(bills.length > 0 && $res.style.display==='none'){ $prev.value = fmtNum(bills[0].currentReading); }
      updateLive();
    }
    function updateLive(){
      var p = parseFloat($prev.value), c = parseFloat($curr.value);
      if(!isNaN(p) && !isNaN(c) && c >= p){
        $liveVal.textContent = fmtCur(calcAmount(p,c,settings.rate)); $live.style.display='flex';
      } else { $live.style.display='none'; }
    }
    $prev.addEventListener('input', updateLive);
    $curr.addEventListener('input', updateLive);

    document.getElementById('calc-btn').addEventListener('click', function(){
      $err.style.display='none';
      var p = parseFloat($prev.value), c = parseFloat($curr.value);
      if($prev.value.trim()==='' || $curr.value.trim()==='' || isNaN(p) || isNaN(c)){
        $err.textContent='יש להזין קריאה קודמת ונוכחית (מספרים בלבד)'; $err.style.display='block'; return;
      }
      if(c < p){ $err.textContent='הקריאה הנוכחית חייבת להיות גדולה או שווה לקריאה הקודמת'; $err.style.display='block'; return; }
      var bill = {
        id: Date.now()+'-'+Math.round(Math.random()*1e6),
        previousReading:p, currentReading:c, rate:settings.rate,
        amount:calcAmount(p,c,settings.rate),
        consumption:Math.round((c-p)*100)/100,
        createdAt:new Date().toISOString()
      };
      bills.unshift(bill); saveBills(bills);
      $curr.value='';
      showResult(bill);
      renderHistory();
    });

    function showResult(bill){
      $note.innerHTML = noteHTML(bill) +
        '<button class="btn" id="copy-result-btn">📋 העתק פירוט חשבון</button>';
      document.getElementById('copy-result-btn').addEventListener('click', function(){ copyText(buildText(bill)); });
      $form.style.display='none'; $res.style.display='block';
    }
    document.getElementById('new-bill-btn').addEventListener('click', function(){
      $res.style.display='none'; $form.style.display='block';
      if(bills.length>0) $prev.value = fmtNum(bills[0].currentReading);
      $curr.value=''; $err.style.display='none'; updateLive();
    });

    // ---------- היסטוריה ----------
    function renderHistory(){
      var el = document.getElementById('history-list');
      if(bills.length===0){
        el.innerHTML = '<div class="empty"><div class="icon">🔌</div><div class="t">אין עדיין חשבונות</div><div class="s">חשבונות שתחשב יופיעו כאן למעקב</div></div>';
        return;
      }
      el.innerHTML = bills.map(function(b){
        return '<div class="hist-card">'+
          '<div class="hist-head"><span class="hist-amount">'+fmtCur(b.amount)+'</span><span class="hist-date">'+fmtDate(b.createdAt)+'</span></div>'+
          '<div class="hist-readings"><span>קודמת: '+fmtNum(b.previousReading)+'</span><span>נוכחית: '+fmtNum(b.currentReading)+'</span><span>צריכה: '+fmtNum(b.consumption)+'</span></div>'+
          '<div class="hist-actions"><button class="chip" data-copy="'+b.id+'">📋 העתק</button><button class="chip del" data-del="'+b.id+'">🗑 מחק</button></div>'+
        '</div>';
      }).join('');
      el.querySelectorAll('[data-copy]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var b = bills.find(function(x){ return x.id===btn.getAttribute('data-copy'); });
          if(b) copyText(buildText(b));
        });
      });
      el.querySelectorAll('[data-del]').forEach(function(btn){
        btn.addEventListener('click', function(){
          if(confirm('האם למחוק את החשבון הזה?')){
            bills = bills.filter(function(x){ return x.id!==btn.getAttribute('data-del'); });
            saveBills(bills); renderHistory(); refreshCalcDefaults();
          }
        });
      });
    }

    // ---------- הגדרות ----------
    var $name=document.getElementById('name'), $addr=document.getElementById('address'), $rate=document.getElementById('rate');
    function loadSettingsForm(){ $name.value=settings.userName; $addr.value=settings.address; $rate.value=settings.rate; }
    document.getElementById('save-settings-btn').addEventListener('click', function(){
      var r = parseFloat($rate.value);
      settings = { userName:$name.value.trim(), address:$addr.value.trim(), rate:(isNaN(r)||r<=0?DEFAULT_RATE:r) };
      saveSettings(settings);
      var btn=this; btn.textContent='✓ נשמר'; btn.classList.add('done');
      setTimeout(function(){ btn.textContent='שמור הגדרות'; btn.classList.remove('done'); }, 1800);
      refreshCalcDefaults();
    });

    // ---------- ניווט ----------
    var titles = { calc:'חשבון חשמל לרכב', history:'מעקב חשבונות', settings:'הגדרות' };
    document.querySelectorAll('nav button').forEach(function(btn){
      btn.addEventListener('click', function(){
        var tab = btn.getAttribute('data-tab');
        document.querySelectorAll('nav button').forEach(function(b){ b.classList.toggle('active', b===btn); });
        document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
        document.getElementById('screen-'+tab).classList.add('active');
        document.getElementById('title').textContent = titles[tab];
        if(tab==='history') renderHistory();
        if(tab==='settings') loadSettingsForm();
        if(tab==='calc') refreshCalcDefaults();
      });
    });

    // ---------- אתחול ----------
    refreshCalcDefaults();
    renderHistory();
    loadSettingsForm();

    // רישום Service Worker (עבודה אופליין)
    if('serviceWorker' in navigator){
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('./sw.js').catch(function(){});
      });
    }
  })();
  </script>
</body>
</html>
